name: Validate and build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
      - name: Set up Python 3.12
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate skill suite
        run: python -B -X utf8 scripts/validate_suite.py
      - name: Run behavior tests
        run: python -B -X utf8 -m unittest discover -s scripts -p "test_*.py" -v
      - name: Build and verify release ZIP
        run: python -B -X utf8 scripts/build_release.py
